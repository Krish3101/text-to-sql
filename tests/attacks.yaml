  category: functions
  description: Arbitrary file write function

- id: reject_readfile
  sql: "SELECT readfile('/etc/passwd')"
  expected: REJECT
  category: functions
  description: Arbitrary file read function

- id: reject_fts3_tokenizer
  sql: "SELECT fts3_tokenizer('x')"
  expected: REJECT
  category: functions
  description: FTS3 tokenizer execution

# REJECT - Table checks & TVFs
- id: reject_pragma_table_info_tvf
  sql: "SELECT * FROM pragma_table_info('orders')"
