# Each case is SQL the model might return and what check_sql must decide.

- id: simple_select
  sql: "SELECT * FROM orders"
  expected: ALLOW

- id: trailing_semicolon_and_comment
  sql: "SELECT customer_id, first_name FROM customers; -- note"
  expected: ALLOW

- id: cte
  sql: "WITH big AS (SELECT * FROM orders WHERE total_amount > 100) SELECT COUNT(*) FROM big"
  expected: ALLOW

- id: union
  sql: "SELECT city FROM customers UNION SELECT shipping_city FROM orders"
  expected: ALLOW

- id: values_in_a_subquery
  sql: "SELECT * FROM (VALUES (1), (2))"
  expected: ALLOW

- id: stacked_drop
  sql: "SELECT 1; DROP TABLE orders;"
  expected: REJECT

- id: update
  sql: "UPDATE products SET price = 0"
  expected: REJECT

- id: delete
  sql: "DELETE FROM orders"
  expected: REJECT

- id: write_inside_a_cte
  sql: "WITH d AS (DELETE FROM orders RETURNING *) SELECT * FROM d"
  expected: REJECT

- id: drop_table
  sql: "DROP TABLE customers"
  expected: REJECT

- id: attach
  sql: "ATTACH DATABASE 'evil.db' AS evil"
  expected: REJECT

- id: pragma
  sql: "PRAGMA query_only = OFF"
  expected: REJECT

- id: vacuum_into
  sql: "VACUUM INTO '/tmp/evil.db'"
  expected: REJECT

- id: sqlite_master
  sql: "SELECT * FROM sqlite_master"
  expected: REJECT

- id: other_database
  sql: "SELECT * FROM temp.orders"
  expected: REJECT
